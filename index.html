<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Замын 2-р анги - Удирдлагын хяналт ба танилцуулга</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @media print { .no-print { display: none !important; } }
    table, th, td { border: 1px solid #000 !important; }
  </style>
</head>
<body class="bg-slate-900 text-gray-100 font-sans p-2 min-h-screen">

  <!-- Удирдлагын Навигаци Хэсэг -->
  <div class="no-print max-w-[1400px] mx-auto bg-slate-800 text-white p-4 rounded-lg mb-4 shadow-xl border border-slate-700">
    <div class="flex flex-wrap justify-between items-center gap-4">
      
      <div class="flex items-center space-x-3">
        <span class="text-xl font-black text-amber-400">👨‍💼 АНГИЙН УДИРДЛАГЫН ХЭСЭГ</span>
      </div>

      <!-- Сонгох Албан тушаал ба Үйлдэл -->
      <div class="flex items-center space-x-3 bg-slate-700 p-2 rounded-md">
        <label class="text-xs font-semibold">Таны албан тушаал:</label>
        <select id="user-role-select" onchange="onRoleChange()" class="bg-slate-800 text-white text-xs p-1.5 rounded border border-slate-600 font-bold">
          <option value="pch">ПЧ - Ангийн дарга</option>
          <option value="zampch">ЗамПЧ - Орлогч дарга</option>
          <option value="zampchu">ЗамПЧу - Урд зам орлогч</option>
          <option value="pchg">ПЧГ - Ерөнхий инженер</option>
        </select>

        <button id="sign-btn" onclick="signReport()" class="bg-green-600 hover:bg-green-500 text-white font-bold text-xs px-4 py-2 rounded shadow transition">
          ✓ Танилцсан гэж тэмдэглэх
        </button>
      </div>

      <div class="flex items-center space-x-2">
        <span id="report-sync-status" class="hidden text-xs px-2 py-1 rounded bg-amber-500 text-black font-semibold">Мэдээлэл ачаалж байна...</span>
        <input type="date" id="manager_date" onchange="onDateChange()" class="bg-slate-700 text-white px-2 py-1 rounded text-xs border border-slate-600">
      </div>

    </div>

    <!-- Сэтгэгдэл бичих бүс -->
    <div class="mt-3 pt-3 border-t border-slate-700 flex items-center space-x-2">
      <input type="text" id="manager-comment" placeholder="Диспетчерт үүрэг даалгавар / сэтгэгдэл бичих..." class="flex-grow bg-slate-900 border border-slate-600 text-white px-3 py-1.5 rounded text-xs focus:outline-none focus:border-amber-400">
      <button onclick="sendComment()" class="bg-amber-600 hover:bg-amber-500 text-black font-bold text-xs px-4 py-1.5 rounded">💬 Сэтгэгдэл илгээх</button>
    </div>
  </div>

  <!-- ДИСПЕТЧЕРИЙН МЭДЭЭГ ХАРАХ БҮС (Цаасан эх зургийн дагуу) -->
  <div class="max-w-[1400px] mx-auto bg-white text-gray-900 p-4 rounded shadow-2xl">
    <div id="report-view-container">
      <!-- Dynamic Rendered Content -->
      <div class="text-center py-10 text-gray-500">Мэдээлэл уншиж байна...</div>
    </div>

    <div class="mt-4 border-t-2 border-black pt-2 bg-yellow-50 p-3 rounded">
      <h3 class="font-bold text-sm text-amber-900">💬 Удирдлагуудын сэтгэгдэл, зааварчилгаа:</h3>
      <div id="comments-list" class="text-xs space-y-1 mt-1 text-gray-800">
        <p class="italic text-gray-500">Сэтгэгдэл ирээгүй байна.</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qzbftqfeugsgpglnwtlp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_iGBuAfDa_YKLvPVAZMOLuQ_d5d-dfj0';

    const ROLES = [
      { code: 'pch', name: 'ПЧ' },
      { code: 'zampch', name: 'ЗамПЧ' },
      { code: 'zampchu', name: 'ЗамПЧу' },
      { code: 'pchg', name: 'ПЧГ' },
      { code: 'pchis', name: 'ПЧИС' },
      { code: 'pchi-1', name: 'ПЧИ-1' },
      { code: 'pchi-2', name: 'ПЧИ-2' },
      { code: 'pchi-3', name: 'ПЧИ-3' },
      { code: 'pchi-4', name: 'ПЧИ-4' },
      { code: 'pchi-5', name: 'ПЧИ-5' },
      { code: 'pcht-1', name: 'ПЧТ-1' },
      { code: 'pcht-2', name: 'ПЧТ-2' },
      { code: 'pchiisco', name: 'ПЧИИССО' },
      { code: 'pds-1', name: 'ПДС-1' },
      { code: 'pds-2', name: 'ПДС-2' },
      { code: 'pds-3', name: 'ПДС-3' },
      { code: 'pds-4', name: 'ПДС-4' },
      { code: 'pchk', name: 'ПЧОК' },
      { code: 'pchf', name: 'ПЧФ' },
      { code: 'pche', name: 'ПЧЭ' },
    ];

    let supabaseClient = null;
    let loadRequestId = 0;
    let lastSignatures = [];
    let lastRenderKey = null;
    let currentHasReport = false;

    // ---------- Туслах ----------
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // UTC биш, төхөөрөмжийн орон нутгийн огноо
    function todayLocal() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }

    function formatSubmittedAt(value) {
      if (!value) return '—';
      const submittedAt = new Date(value);
      if (Number.isNaN(submittedAt.getTime())) return '—';
      const pad = number => String(number).padStart(2, '0');
      return `${pad(submittedAt.getHours())}:${pad(submittedAt.getMinutes())}:${pad(submittedAt.getSeconds())}`;
    }

    function safeLocalGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function safeLocalSet(key, v) { try { localStorage.setItem(key, v); } catch (e) {} }

    function setStatus(text, cls) {
      const status = document.getElementById('report-sync-status');
      status.innerText = text;
      status.className = `text-xs px-2 py-1 rounded font-semibold ${cls}`;
    }

    // ---------- Эхлүүлэх ----------
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('manager_date').value = todayLocal();
      const savedRole = safeLocalGet('pch_role');
      if (savedRole && ROLES.some(r => r.code === savedRole)) {
        document.getElementById('user-role-select').value = savedRole;
      }
      try {
        initSupabase();
        loadReport();
        setInterval(loadReport, 10000);
      } catch (error) {
        console.error('Supabase холболт эхлүүлэхэд алдаа гарлаа:', error);
        showReportError(error);
      }
    });

    function initSupabase() {
      if (!window.supabase?.createClient) {
        throw new Error('Supabase SDK ачаалагдсангүй.');
      }
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    function onRoleChange() {
      safeLocalSet('pch_role', document.getElementById('user-role-select').value);
      checkCurrentRoleStatus();
    }

    function onDateChange() {
      lastRenderKey = null;
      loadReport();
    }

    // ---------- Унших ----------
    async function loadReport() {
      if (!supabaseClient) return;
      const reportDate = document.getElementById('manager_date').value;
      const requestId = ++loadRequestId;

      try {
        const [repRes, sigRes, comRes] = await Promise.all([
          supabaseClient.from('daily_reports').select('data,updated_at').eq('report_date', reportDate).maybeSingle(),
          supabaseClient.from('report_signatures').select('role_code,status,signed_at').eq('report_date', reportDate),
          supabaseClient.from('report_comments').select('*').eq('report_date', reportDate).order('created_at', { ascending: true })
        ]);

        if (repRes.error) throw repRes.error;
        let warning = false;
        if (sigRes.error) { console.error('Гарын үсэг татахад алдаа:', sigRes.error); warning = true; }
        if (comRes.error) { console.error('Сэтгэгдэл татахад алдаа:', comRes.error); warning = true; }

        // Огноо солигдсон / шинэ хүсэлт гарсан бол хуучин хариуг орхино
        if (requestId !== loadRequestId) return;

        const data = repRes.data ? repRes.data.data : null;
        const submittedAt = repRes.data?.updated_at || data?.submittedAt || '';
        const signatures = sigRes.error ? lastSignatures : (sigRes.data || []);
        const comments = comRes.error ? null : (comRes.data || []);

        currentHasReport = !!data;
        lastSignatures = signatures;

        // Мэдээлэл өөрчлөгдөөгүй бол дахин зурахгүй (гүйлгэлт, сонголт алдагдахгүй)
        const key = JSON.stringify([reportDate, data, submittedAt, signatures, comments]);
        if (key !== lastRenderKey) {
          lastRenderKey = key;
          renderReportView(data, reportDate, submittedAt);
          if (comments) renderComments(comments);
        }
        checkCurrentRoleStatus();

        if (warning) setStatus('Тайлан харагдаж байна; гарын үсэг/сэтгэгдэл татагдсангүй', 'bg-amber-500 text-black');
        else setStatus(data ? 'Мэдээлэл шинэчлэгдсэн' : 'Энэ өдөр мэдээлэл алга', data ? 'bg-green-500 text-white' : 'bg-amber-500 text-black');
      } catch (error) {
        console.error('Удирдлагын тайлан ачаалахад алдаа гарлаа:', error);
        if (requestId === loadRequestId) showReportError(error);
      }
    }

    function showReportError(error) {
      setStatus('Холболтын алдаа', 'bg-red-600 text-white');
      document.getElementById('report-view-container').textContent = `Тайланг уншихад алдаа гарлаа: ${error.message}`;
    }

    // ---------- Харуулах ----------
    function renderComments(comments) {
      const box = document.getElementById('comments-list');
      if (!comments.length) {
        box.innerHTML = '<p class="italic text-gray-500">Сэтгэгдэл ирээгүй байна.</p>';
        return;
      }
      box.innerHTML = comments.map(c => {
        const role = ROLES.find(r => r.code === c.role_code);
        const time = c.created_at ? new Date(c.created_at).toLocaleString() : '';
        return `<div class="p-1 bg-white border rounded shadow-sm">
          <span class="font-bold text-blue-700">${esc(role ? role.name : c.role_code)}:</span> ${esc(c.comment)}
          <span class="text-[10px] text-gray-400 block">${esc(time)}</span>
        </div>`;
      }).join('');
    }

    function renderReportView(data, reportDate = '', submittedAt = '') {
      const container = document.getElementById('report-view-container');
      if (!data) {
        container.innerHTML = `<div class="text-center py-12 text-red-500 font-bold">⚠️ Энэ өдөр диспетчерээс мэдээлэл оруулаагүй байна.</div>`;
        return;
      }

      const buildTableRows = (rowsData) => {
        if (!Array.isArray(rowsData) || rowsData.length === 0) {
          return '<tr><td colspan="10" class="text-center italic text-gray-400">Мэдээлэлгүй</td></tr>';
        }
        return rowsData.map(r => `<tr>${(Array.isArray(r) ? r : []).map(c => `<td class="p-1 text-center text-xs whitespace-pre-line break-words">${esc(c)}</td>`).join('')}</tr>`).join('');
      };

      const locations = data.locations || {};

      const rolesHtml = ROLES.map(r => {
        const loc = locations[r.code] || 'Контор';
        return `
          <tr class="text-[11px]">
            <td class="p-1 font-bold">${esc(r.name)}</td>
            <td class="p-1 text-center bg-gray-50">${esc(loc)}</td>
          </tr>`;
      }).join('');

      container.innerHTML = `
        <div class="flex justify-between items-start mb-2 border-b-2 border-black pb-2">
          <div>
            <p class="text-xs text-gray-600">ПЧД-с ирүүлсэн цаг:</p>
            <p class="mt-1 text-lg font-bold tabular-nums text-gray-900">${esc(formatSubmittedAt(submittedAt || data.submittedAt))}</p>
          </div>
          <div class="text-center"><h1 class="text-xl font-bold uppercase">Замын 2-р ангийн хэсэг, цехүүдийн хоногийн ажлын мэдээ</h1></div>
          <div class="text-right text-xs">
            <div class="inline-flex max-w-full flex-col items-end gap-1 rounded-md border border-blue-200 border-r-4 border-r-blue-600 bg-blue-50 px-3 py-2 shadow-sm">
              <span class="text-[10px] font-semibold uppercase tracking-wide text-slate-500">Хоногийн мэдээ нэгтгэсэн ПЧД</span>
              <span class="max-w-[240px] break-words text-sm font-bold text-blue-900">${esc(data.dispatcherName || '—')}</span>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-12 gap-2 mb-2">
          <div class="col-span-3">
            <div class="bg-gray-200 font-bold text-center py-1 border border-black text-xs">Анхаарамжтай км</div>
            <table class="w-full text-xs">
              <thead class="bg-gray-100">
                <tr><th>Хэсэг</th><th>Эх</th><th>Дуус</th><th>Хурд</th><th>Байрлал</th><th>Шалтгаан</th></tr>
              </thead>
              <tbody>${buildTableRows(data.caution)}</tbody>
            </table>
          </div>

          <div class="col-span-6">
            <div class="bg-gray-200 font-bold text-center py-1 border border-black text-xs">Тэргэнцрийн мэдээ</div>
            <table class="w-full text-xs">
              <thead class="bg-gray-100">
                <tr><th>Оператор</th><th>Шалгасан</th><th>Гэмтэл</th><th>Ажил удирдагч</th><th>Өнөөдөр</th><th>Ажил удирдагч</th><th>Маргааш</th></tr>
              </thead>
              <tbody>${buildTableRows(data.cart)}</tbody>
            </table>

            <div class="bg-gray-200 font-bold text-center py-1 border border-black text-xs mt-2">Гологдол зөрчил</div>
            <table class="w-full text-xs">
              <thead class="bg-gray-100">
                <tr><th>Хэсэг</th><th>Байршил</th><th>Зогсолт</th><th>Зөрчлийн шалтгаан</th><th>Зам шалгасан байдал</th></tr>
              </thead>
              <tbody>${buildTableRows(data.defect)}</tbody>
            </table>
          </div>

          <div class="col-span-3 min-w-0">
            <div class="bg-gray-200 font-bold text-center py-1 border border-black text-xs">Ангийн удирдлага (Байршил)</div>
            <div class="max-h-[300px] overflow-y-auto border border-black">
              <table class="w-full table-fixed text-xs">
                <thead><tr class="bg-gray-100 text-[10px]"><th class="w-2/5">Албан тушаал</th><th class="w-3/5">Байршил</th></tr></thead>
                <tbody>${rolesHtml}</tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-12 gap-2 mb-2">
          <div class="col-span-7">
            <div class="bg-gray-200 font-bold text-center py-1 border border-black text-xs">Ирсэн буусан материал</div>
            <table class="w-full text-xs">
              <thead class="bg-gray-100"><tr><th>Хэсэг</th><th>Вагон №</th><th>Ачааны нэр</th><th>Хэмжээ</th><th>Санамж</th></tr></thead>
              <tbody>${buildTableRows(data.material)}</tbody>
            </table>
          </div>

          <div class="col-span-5 grid grid-cols-12 gap-1">
            <div class="col-span-8">
              <div class="bg-gray-200 font-bold text-center py-1 border border-black text-xs">Гармын зөрчил</div>
              <table class="w-full text-xs">
                <thead class="bg-gray-100"><tr><th>Гарам</th><th>Хугацаа</th><th>Зөрчил</th><th>Гаргасан</th><th>Авсан арга</th></tr></thead>
                <tbody>${buildTableRows(data.crossing)}</tbody>
              </table>
            </div>
            <div class="col-span-4 border border-black p-1 text-xs">
              <div class="font-bold text-center border-b">3ТВ Мэдээ</div>
              <p class="mt-1"><b>3ТВ-472:</b> ${esc(data.tv472) || '—'}</p>
              <p class="mt-2"><b>3ТВ-475:</b> ${esc(data.tv475) || '—'}</p>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-12 gap-2">
          <div class="col-span-6">
            <div class="bg-gray-200 font-bold text-center py-1 border border-black text-xs">Мотвозын мэдээ</div>
            <table class="w-full text-xs">
              <thead class="bg-gray-100"><tr><th>Марк</th><th>Хаана</th><th>Гүйцэтгэсэн ажил</th><th>Байрлал</th></tr></thead>
              <tbody>${buildTableRows(data.motvoz)}</tbody>
            </table>
          </div>
          <div class="col-span-6">
            <div class="bg-gray-200 font-bold text-center py-1 border border-black text-xs">Солигдсон ЗДЦ-ын материал</div>
            <table class="w-full text-xs">
              <thead class="bg-gray-100"><tr><th>Хэсэг</th><th>Байршил</th><th>Материал</th><th>Тоо</th><th>Гэмтэл</th><th>Тайлбар</th></tr></thead>
              <tbody>${buildTableRows(data.zdts)}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ---------- Танилцсан ----------
    function checkCurrentRoleStatus() {
      const role = document.getElementById('user-role-select').value;
      const btn = document.getElementById('sign-btn');
      const signed = lastSignatures.some(s => s.role_code === role && s.status === 'signed');

      if (signed) {
        btn.innerText = '✓ Танилцсан байна';
        btn.className = 'bg-gray-600 text-white font-bold text-xs px-4 py-2 rounded cursor-not-allowed';
        btn.disabled = true;
      } else {
        btn.innerText = '✓ Танилцсан гэж тэмдэглэх';
        btn.className = 'bg-green-600 hover:bg-green-500 text-white font-bold text-xs px-4 py-2 rounded shadow transition';
        btn.disabled = false;
      }
    }

    async function signReport() {
      const reportDate = document.getElementById('manager_date').value;
      const role = document.getElementById('user-role-select').value;
      const btn = document.getElementById('sign-btn');

      if (!supabaseClient) { alert('⚠️ Supabase холболтгүй байна.'); return; }
      if (!currentHasReport) { alert('⚠️ Энэ өдөр диспетчер тайлан илгээгээгүй байна.'); return; }

      btn.disabled = true;
      try {
        const now = new Date().toISOString();
        const { error } = await supabaseClient
          .from('report_signatures')
          .upsert(
            { report_date: reportDate, role_code: role, status: 'signed', signed_at: now, updated_at: now },
            { onConflict: 'report_date,role_code' }
          );
        if (error) throw error;
        alert('✅ "Танилцсан" төлөвт амжилттай орж диспетчерт мэдэгдлээ!');
        lastRenderKey = null;
        await loadReport();
      } catch (error) {
        console.error('Гарын үсэг хадгалахад алдаа:', error);
        alert('Алдаа: ' + error.message);
        checkCurrentRoleStatus();
      }
    }

    // ---------- Сэтгэгдэл ----------
    async function sendComment() {
      const reportDate = document.getElementById('manager_date').value;
      const role = document.getElementById('user-role-select').value;
      const input = document.getElementById('manager-comment');
      const comment = input.value.trim();

      if (!comment) { alert('Сэтгэгдэл бичнэ үү!'); return; }
      if (!supabaseClient) { alert('⚠️ Supabase холболт шаардлагатай.'); return; }

      try {
        // Сэтгэгдэл бүр тусдаа мөр болж хадгалагдана (өмнөх сэтгэгдлийг дарахгүй)
        const { error } = await supabaseClient
          .from('report_comments')
          .insert({ report_date: reportDate, role_code: role, comment });
        if (error) throw error;
        alert('💬 Сэтгэгдэл диспетчерт амжилттай хүрэгдлээ!');
        input.value = '';
        lastRenderKey = null;
        await loadReport();
      } catch (error) {
        console.error('Сэтгэгдэл илгээхэд алдаа:', error);
        alert('Алдаа: ' + error.message);
      }
    }
  </script>
</body>
</html>
